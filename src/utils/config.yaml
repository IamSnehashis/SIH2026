# Central configuration. Every script reads from this file so there is
# a single source of truth for paths, CRS, tiling, and model hyperparams.

paths:
  raw_dir: "data/raw"              # original medium-res satellite scenes (.tif)
  tiles_dir: "data/tiles"          # LR/HR tile pairs generated by preprocess.py
  processed_dir: "data/processed"  # normalized, split-ready tensors
  models_dir: "models"
  outputs_dir: "outputs"

gis:
  target_crs: "EPSG:4326"          # reproject everything to a common CRS
  tile_size: 128                   # pixels, LR tile size
  scale_factor: 4                  # SRM upscale factor (e.g. 10m -> 2.5m)
  overlap: 16                      # px overlap between tiles for stitching
  nodata_value: 0
  bands: [1, 2, 3, 4]              # e.g. B,G,R,NIR for Sentinel-2 style input

dl:
  architecture: "edsr"             # options: srcnn | edsr | esrgan_lite
  in_channels: 4
  num_features: 64
  num_res_blocks: 16
  batch_size: 16
  epochs: 100
  lr: 0.0002
  val_split: 0.15
  loss: "l1+ssim"                  # combine pixel loss with SSIM for sharper edges
  device: "cuda"                   # falls back to cpu automatically if unavailable
  checkpoint_name: "srm_best.pth"

backend:
  host: "0.0.0.0"
  port: 8000
  max_upload_mb: 200
